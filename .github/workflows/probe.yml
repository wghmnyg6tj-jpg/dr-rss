name: Test kilder (midlertidig)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gem rå HTML i grenen probe-samples
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          mkdir s && cd s
          curl -sS -L -m 20 -A "$UA" -o metro.html "https://m.dk/da/drift-og-service/status-og-planlagte-driftsaendringer/" || true
          curl -sS -L -m 20 -A "$UA" -o dsb.html "https://www.dsb.dk/trafikinformation/" || true
          curl -sS -L -m 20 -A "$UA" -o star.html "https://www.star.dk/nyheder/" || true
          curl -sS -L -m 20 -A "$UA" -o akasser.html "https://www.a-kasser.dk/nyheder" || true
          curl -sS -L -m 20 -A "$UA" -o dmi.html "https://www.dmi.dk/meteorologens-kommentar" || true
          curl -sS -L -m 20 -A "$UA" -o bus.html "https://dinoffentligetransport.dk/planlaeg-din-rejse/koereplaner-for-bus-og-havnebus/aendringer-i-bustrafikken" || true
          ls -la
          git init -q -b probe-samples && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -q -m samples
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-samples
