name: Test kilder (midlertidig)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hent kilder
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for u in \
            "https://m.dk/da/drift-og-service/status-og-planlagte-driftsaendringer/" \
            "https://www.dsb.dk/trafikinformation/" \
            "https://dinoffentligetransport.dk/planlaeg-din-rejse/koereplaner-for-bus-og-havnebus/aendringer-i-bustrafikken" \
            "https://www.star.dk/" \
            "https://www.star.dk/nyheder/" \
            "https://www.a-kasser.dk/nyheder" \
            "https://www.dmi.dk/meteorologens-kommentar" \
            "https://www.dmi.dk/vejr/meteorologens-kommentar" \
            "https://www.tv2kosmopol.dk/" \
            "https://www.tv2kosmopol.dk/rss" \
            "https://www.thelocal.dk/feeds/rss.php" ; do
            code=$(curl -sS -L -m 20 -A "$UA" -o /tmp/p.html -w "%{http_code} %{content_type} %{size_download}" "$u" || echo ERR)
            echo "=== $u -> $code"
            python3 - <<'PY'
          import re
          s=open('/tmp/p.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>',' ',s)
          t=re.sub(r'<[^>]+>',' ',t); t=re.sub(r'\s+',' ',t)
          print('TEXT:', t[:1500])
          print('JSONLD/NEXT:', bool(re.search(r'__NEXT_DATA__|application/ld\+json|__NUXT__',s)))
          for m in re.findall(r'(?:href|src)="([^"]*(?:api|json|rss|feed)[^"]*)"',s)[:15]: print('LINK:',m)
          PY
          done
